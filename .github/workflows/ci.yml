name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:    

jobs:
  unit-tests-backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21  
          cache-dependency-path: bugtracker-backend/go.sum

      - name: Execute Backend Unit Tests
        working-directory: ./bugtracker-backend
        run: |
          go test -v ./... 
      
  unit-tests-frontend:
    needs: unit-tests-backend
    runs-on: ubuntu-latest
    steps:
      - name: checkout code   
        uses: actions/checkout@v7

      - name: Setup Node.js   
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bugtracker-frontend/package-lock.json

      - name: Execute frontend Unit Tests
        working-directory: ./bugtracker-frontend
        run: |
          npm ci
          npm test
      
      - name: Publish FrontEnd Test Result
        uses: dorny/test-reporter@v1
        if: always()    
        with:
          name: Frontend Unit Tests Report
          path: bugtracker-frontend/test-results.xml
          reporter: jest-junit
  
  api-test:
    needs: 
      - unit-tests-backend     
      - unit-tests-frontend
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout/@v7
      
      - name: Launch Application
        run: |
          docker compose up --build -d
          npx wait-port http://localhost:8080/api/health -t 30000

      - name: Run API Tests     
        working-directory: ./tests-api
        run: |
          npm ci  
          npx playwright test

          