name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:    

jobs:
  unit-tests-backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21  
          cache-dependency-path: bugtracker-backend/go.sum

      - name: Execute Backend Unit Tests
        working-directory: ./bugtracker-backend
        run: |
          go test -v ./... 
      
     
    